<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天</title>
    <link href="css/material-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5fa;
            --panel: #ffffff;
            --panel-hover: #f8fafc;
            --primary: #4f46e5;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: transparent; /* Allow parent background to show */
            color: var(--text);
        }

        .top-area {
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            /* background-image: linear-gradient(to bottom, rgba(7, 10, 18, 0) 0%, rgba(7, 10, 18, 0.8) 100%); */
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%); /* Fade in effect at top */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-end;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            line-height: 1.5;
            font-size: 15px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        }

        .message.ai .message-content {
            background-color: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background-color: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .input-container {
            display: flex;
            align-items: center;
            padding: 16px;
            /* background-color: var(--bg); */
            background: linear-gradient(to top, var(--bg) 80%, transparent);
            border-top: 1px solid transparent;
        }

        .input-area {
            display: flex;
            align-items: center;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 12px;
            height: 54px;
            box-sizing: border-box;
            width: 100%;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        
        .input-area:focus-within {
            border-color: var(--primary);
            background-color: var(--panel-hover);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .input-area input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 0 10px;
            background: none;
            color: var(--text);
        }
        
        .input-area input::placeholder {
            color: var(--muted);
        }

        .input-area button {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--muted);
            cursor: pointer;
            margin: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .input-area button:hover {
            color: var(--primary);
            background-color: rgba(15, 23, 42, 0.06);
        }
        
        .input-area button.send-button {
            color: var(--primary);
        }
        
        .input-area button.send-button:hover {
             transform: scale(1.1);
        }

        .voice-input-area {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;

            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border-radius: 99px;
            padding: 0;
            height: 100%;
            box-sizing: border-box;
            width: 100%;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.2s;
        }
        
        .voice-input-area:hover {
            color: var(--text);
        }
        
        .voice-input-area:active {
            color: var(--primary);
            background-color: rgba(79, 70, 229, 0.08);
        }

        .voice-input-area span {
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 上半区域 -->
    <div class="top-area"></div>

    <!-- 聊天容器 -->
    <div class="chat-container" id="chat-container">
        <!-- 聊天记录将显示在这里 -->
    </div>

    <!-- 输入区域 -->
    <div class="input-container">
        <div class="input-area" id="input-area">
            <button class="input-toggle" id="toggle-button">
                <i class="material-icons">keyboard</i>
            </button>
            <div class="voice-input-area" id="voice-input-area">
                <span>点击开始对话</span>
            </div>
            <input type="text" id="text-input" placeholder="发送消息" style="display: none;">
            <button class="send-button" id="send-button" style="display: none;">
                <i class="material-icons">send</i>
            </button>
        </div>
    </div>
    <script src="js/audio_recorder.js"></script>
    <script src="js/dialog_realtime.js"></script>
</body>
</html>
