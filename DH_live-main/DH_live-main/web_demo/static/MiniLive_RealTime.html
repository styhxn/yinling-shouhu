<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>
        <link rel="icon" href="common/favicon.ico" type="image/x-icon">
        <title>MiniLive</title>
        <style>
            :root {
                --bg: #f4f5fa;
                --panel: rgba(255, 255, 255, 0.92);
                --panel-hover: #FFFFFF;
                --primary: #4f46e5;
                --text: #0f172a;
                --muted: #64748b;
                --border: #e2e8f0;
            }

            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100vw;
                height: 100vh;
                margin: 0;
                background-color: transparent;
                overflow: hidden; /* 防止滚动条出现 */
                color: var(--text);
                font-family: 'Segoe UI', sans-serif;
            }

            video, canvas {
                border: 0;
                /* box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); */
            }

            #canvas_video {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: contain; /* Contain to show full image without cropping */
            }

            #canvas_gl {
                position: absolute;
                top: -9999px;
                left: -9999px;
                width: 128px;
                height: 128px;
            }

            #screen {
                position: absolute;
                bottom: -1000;
                right: -1000;
                width: 1px;
                height: 1px;
            }

            #screen2 {
                width: 100%;
                height: 100%;
                position: absolute; /* Position the iframe absolutely */
                top: 0;
                left: 0;
                border: none;
                z-index: 5; /* Ensure iframe is above other elements */
                background: transparent;
            }

            /* 居中显示"请点击开始" */
            #startMessage {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 18px;
                font-weight: 500;
                color: var(--muted);
                z-index: -2;
                background: var(--panel);
                padding: 12px 24px;
                border-radius: 99px;
                border: 1px solid var(--border);
                backdrop-filter: blur(5px);
            }

            #dropdownContainer, #voiceDropdownContainer {
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 10;
            }

            #voiceDropdownContainer {
                top: 70px;
            }

            #characterDropdown, #voiceDropdown {
                appearance: none;
                -webkit-appearance: none;
                -moz-appearance: none;
                padding: 8px 32px 8px 16px;
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                background-color: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
                cursor: pointer;
                outline: none;
                transition: all 0.2s ease;
                backdrop-filter: blur(10px);
            }
            
            #characterDropdown option, #voiceDropdown option {
                background-color: #ffffff;
                color: var(--text);
            }

            #characterDropdown:hover, #voiceDropdown:hover {
                background-color: var(--panel-hover);
                border-color: var(--primary);
            }

            #characterDropdown:focus, #voiceDropdown:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            }

            #dropdownContainer::after, #voiceDropdownContainer::after {
                content: '▼';
                position: absolute;
                top: 50%;
                right: 12px;
                transform: translateY(-50%);
                pointer-events: none;
                color: var(--muted);
                font-size: 10px;
            }
            #canvasEl {
                position: absolute;
                left: -9999px;  /* 移出可视区域 */
                top: -9999px;
                /* 保持canvas正常尺寸 */
                width: 300px;
                height: 150px;
            }
            
            #loadingSpinner {
                color: var(--muted);
                font-family: sans-serif;
            }
        </style>
    </head>
    <body>
        <div id="dropdownContainer">
            <select id="characterDropdown">
                <option value="assets">男性一</option>
                <option value="assets2">女性一</option>
            </select>
        </div>
        <div id="voiceDropdownContainer">
            <select id="voiceDropdown">
                <option value=0>温柔女</option>
                <option value=1>温柔男</option>
                <option value=2>甜美女</option>
                <option value=3>青年女</option>
                <option value=4>磁性男</option>
            </select>
        </div>

        <figure style="overflow:visible;" id="loadingSpinner">
            <strong>MiniMates: loading...</strong>
        </figure>
        <canvas id="canvasEl"></canvas>
        <canvas id="canvas_video"></canvas>
        <canvas id="canvas_gl" width="128" height="128"></canvas>
        <div id="screen"></div>
        <iframe id="screen2" src="dialog_RealTime.html" frameborder="0" style="display: none;"></iframe>
        <div id="startMessage">加载中</div>
        <script src="js/pako.min.js"></script>
        <script src="js/mp4box.all.min.js"></script>
        <script src="js/DHLiveMini.js"></script>
        <script src="js/MiniMateLoader.js"></script>
        <script src="js/MiniLive2.js"></script>
    </body>
</html>
