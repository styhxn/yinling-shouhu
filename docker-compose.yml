name: yinling-shouhu

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yinling}
      POSTGRES_USER: ${POSTGRES_USER:-yinling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yinling} -d ${POSTGRES_DB:-yinling}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    image: yinling-shouhu:latest
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-yinling}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-yinling}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_SSL: "0"
      DEMO_MODE: "1"
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-in-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3100}
      # 直接通过 http://IP:3100 演示时须为 0；启用 HTTPS 后必须改为 1
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      LLM_MOCK: ${LLM_MOCK:-0}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-}
      ARK_MODEL: ${ARK_MODEL:-}
    volumes:
      - app-data:/app/data
      - app-public:/app/apps/api/public
    restart: unless-stopped

volumes:
  app-data:
  app-public:
  pg-data:
