name: yinling-shouhu

services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yinling}
      MYSQL_USER: ${MYSQL_USER:-yinling}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
    image: yinling-shouhu:latest
    ports:
      - "${APP_PORT:-3100}:3100"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_DRIVER: mysql
      DATABASE_URL: mysql://${MYSQL_USER:-yinling}:${MYSQL_PASSWORD:-change-this-password}@db:3306/${MYSQL_DATABASE:-yinling}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_SSL: "0"
      DEMO_MODE: ${DEMO_MODE:-1}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-in-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3100}
      # 直接通过 http://IP:3100 演示时须为 0；启用 HTTPS 后必须改为 1
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      LLM_MOCK: ${LLM_MOCK:-0}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-}
      ARK_MODEL: ${ARK_MODEL:-}
    volumes:
      - app-data:/app/data
      - app-public:/app/apps/api/public
    restart: unless-stopped

volumes:
  app-data:
  app-public:
  mysql-data:
